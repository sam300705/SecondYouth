apiVersion: apps/v1
kind: Deployment
metadata:
  name: secondyouth-api
  labels:
    app.kubernetes.io/name: secondyouth-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secondyouth-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secondyouth-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/secondyouth-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8787"
            - name: REQUIRE_AUTH
              value: "true"
            - name: SECONDYOUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secondyouth-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secondyouth-secrets
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: secondyouth-api
spec:
  selector:
    app.kubernetes.io/name: secondyouth-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
